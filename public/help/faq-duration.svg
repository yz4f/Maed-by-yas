<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" role="img" aria-labelledby="title desc">
  <title id="title">مدة الاشتراك</title>
  <desc id="desc">تظهر مدة الترخيص المتبقية أعلى بطاقة المنتج في صفحة منتجاتي</desc>
  <rect width="960" height="540" rx="28" fill="#071622"/>
  <rect x="28" y="28" width="904" height="484" rx="24" fill="#102534" stroke="#3b7280" stroke-width="2"/>
  <text x="880" y="95" text-anchor="end" direction="rtl" font-family="Arial,sans-serif" font-size="34" font-weight="700" fill="#eefaff">كيف أعرف مدة اشتراكي؟</text>
  <text x="880" y="133" text-anchor="end" direction="rtl" font-family="Arial,sans-serif" font-size="20" fill="#aed1db">راقب شارة الوقت في بطاقة المنتج</text>
  <rect x="178" y="181" width="604" height="272" rx="24" fill="#0b1b28" stroke="#356779" stroke-width="2"/>
  <rect x="227" y="215" width="508" height="116" rx="16" fill="#193949"/>
  <rect x="272" y="241" width="242" height="64" rx="14" fill="#1c414a" stroke="#85d7d0" stroke-width="2"/>
  <circle cx="477" cy="273" r="13" fill="none" stroke="#9be8ed" stroke-width="3"/>
  <path d="M477 263v11l7 5" fill="none" stroke="#9be8ed" stroke-width="3" stroke-linecap="round"/>
  <text x="452" y="282" text-anchor="end" direction="rtl" font-family="Arial,sans-serif" font-size="22" font-weight="700" fill="#dcfbf6">متبقي 30 يومًا</text>
  <text x="682" y="386" text-anchor="end" direction="rtl" font-family="Arial,sans-serif" font-size="25" font-weight="700" fill="#eefaff">بطاقة المنتج</text>
  <text x="480" y="489" text-anchor="middle" direction="rtl" font-family="Arial,sans-serif" font-size="18" fill="#b4d5dd">عند انتهاء المدة تظهر حالة «منتهٍ» وينتقل المنتج إلى قسم المنتجات المنتهية</text>
</svg>
